<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Cadastro de Usuário</h2>

    <form>

        Nome: <input type="text" id="nome" placeholder="Digite seu nome completo"><br><br>

        Email: <input type="text" id="email" placeholder="seuemail@exemplo.com"><br><br>

        Senha: <input type="password" id="senha" placeholder="Digite sua senha"><br><br>
        <p id="mensagemSenha"></p>

        Telefone: <input type="text" id="telefone" placeholder="(xx) xxxxx-xxxx"><br><br>

        Endereço: <input type="text" id="endereco" placeholder="Digite seu endereço"><br><br>
        <button type="button" id="cadastrar">Cadastrar</button>

        <p id="mensagem"></p>

    </form>

    <script src="script.js"></script>

</body>

</html>
