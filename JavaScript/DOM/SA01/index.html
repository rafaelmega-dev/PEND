<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="background-decoration"></div>
        
        <div class="form-container">
            <!-- Seção de Usuário -->
            <div class="form-section">
                <h1 class="form-title">Faça seu cadastro</h1>
                
                <form class="form-group">
                    <!-- Bloco de dados de usuário -->
                    <div class="form-content">
                        <h2 class="section-title">Dados Pessoais</h2>

                        <div class="input-wrapper">
                            <label for="nome">Nome *</label>
                            <input type="text" id="nome" placeholder="Ex: José da Silva" required>
                            <span class="error-message" id="mensagemNome"></span>
                        </div>

                        <div class="input-wrapper">
                            <label for="email">Seu e-mail *</label>
                            <input type="email" id="email" placeholder="Ex: seuemail@exemplo.com" required>
                            <span class="error-message" id="mensagemEmail"></span>
                        </div>

                        <div class="input-wrapper">
                            <label for="senha">Sua senha *</label>
                            <input type="password" id="senha" placeholder="Ex: Senha123" required>
                            <span class="error-message" id="mensagemSenha"></span>
                        </div>

                        <div class="input-wrapper">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" placeholder="Ex: (11) 99123-4567">
                            <span class="error-message" id="mensagemTelefone"></span>
                        </div>

                        
                    </div>

                    <!-- Bloco de endereço -->
                    <div class="form-content">
                        <h2 class="section-title">Endereço</h2>

                        <div class="input-wrapper">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" placeholder="Ex: 12345-123">
                            <span class="error-message" id="mensagemCep"></span>
                        </div>

                        <div class="input-wrapper">
                            <label for="rua">Rua / Avenida *</label>
                            <input type="text" id="rua" placeholder="Ex: Avenida Brasil, 1234">
                            <span class="error-message" id="mensagemRua"></span>
                        </div>

                        <div class="input-row">
                            <div class="input-wrapper">
                                <label for="numero">Número *</label>
                                <input type="number" id="numero" placeholder="Ex: 123">
                                <span class="error-message" id="mensagemNumero"></span>
                            </div>

                            <div class="input-wrapper">
                                <label for="complemento">Complemento</label>
                                <input type="text" id="complemento" placeholder="Ex: Apartamento 101">
                                <span class="error-message" id="mensagemComplemento"></span>
                            </div>
                        </div>

                        <button type="button" class="btn btn-secondary" id="cadastrarEndereco">
                            Adicionar Endereço
                        </button>
                        <span class="error-message" id="mensagemEndereco"></span>

                        <!-- Lista de endereços -->
                        <div class="address-list-wrapper">
                            <h3 class="list-title">Seus Endereços</h3>
                            <ul class="address-list" id="listaEnderecos"></ul>
                        </div>
                    </div>

                    <!-- Botão principal de cadastro -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" id="cadastrar">
                            Cadastrar
                        </button>
                    </div>

                    <span class="error-message" id="mensagemIndex"></span>

                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
