<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Cadastro de Usuário</h2>

    <form>

        Nome: <input type="text" id="nome" placeholder="Ex: José da SIlva"><br><br>
        <p id="mensagemNome"></p>

        Email: <input type="text" id="email" placeholder="Ex: seuemail@exemplo.com"><br><br>
        <p id="mensagemEmail"></p>

        Senha: <input type="password" id="senha" placeholder="Ex: Senha123"><br><br>
        <p id="mensagemSenha"></p>

        Telefone: <input type="text" id="telefone" placeholder="Ex: (11) 99123-4567"><br><br>
        <p id="mensagemTelefone"></p>

    <h2>Cadastro de Endereço</h2>

        CEP: <input type="number" id="cep" placeholder="Ex: 12345-123"><br><br>
        <p id="mensagemCep"></p>

        Rua / Avenida: <input type="text" id="rua" placeholder="Ex: Avenida Brasil, 1234"><br><br>
        <p id="mensagemRua"></p>

        Número: <input type="number" id="numero" placeholder="Ex: 123"><br><br>
        <p id="mensagemNumero"></p>

        Complemento: <input type="text" id="complemento" placeholder="Ex: Apartamento 101"><br><br>
        <p id="mensagemComplemento"></p>

        <button type="button" id="cadastrarEndereco">Adicionar Endereço</button>
        <p id="mensagemEndereco"></p>

        <h3>Seus Endereços</h3>
        <ul id="listaEnderecos"></ul>
        
        <button type="button" id="cadastrar">Cadastrar</button>
        <p id="mensagemIndex"></p>

    </form>

    <script src="script.js"></script>

</body>

</html>
