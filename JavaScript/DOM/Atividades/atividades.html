<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades DOM</title>
    <link rel="stylesheet" href="atividades.css">
</head>
<body>

    <h2>Atividade 1-Botão que deixa azul e vermelho </h2>
    <h3 id="textoCor">Texto para ser alterado</h3>
    <button id="botaoAzul">Deixe seu texto azul!!</button><br><br><br>
    <button id="botaoVermelho">Deixe seu texto vermelho!!</button>
    
    <hr>

    <h2>Atividade 2-Botão que esconde o texto</h2>
    <h3 id="textoEscondido">Texto para ser escondido</h3>
    <button id="botaoOcultar">Esconder/Mostrar texto</button><br><br>

    <hr>

    <h2>Atividade 3-Contador de caracteres</h2>
    <input type="text" id="inputTexto">
    <p id="paragContCarac">Caracteres digitados: 0</p>

    <hr>

    <h2>Atividade 4-Contador de cliques</h2>
    <button id="botaoContCliques">Clique aqui!!</button>
    <p id="paragContCliques">Número de cliques: 0</p>

    <hr>

    <h2>Atividade 5-Criar item da lista</h2>
    <input type="text" id="inputItemLista">
    <button id="botaoListaAdd">Adicionar Item</button>
    <ul id="lista">
        <li></li>
    </ul>



    <script src="atividades.js"></script>
</body>
</html>
