<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validações simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-group">
            <label for="inputEmail">Email</label>
            <input type="text" id="inputEmail">
            <p id="paragValidacaoEmail" class="validation-message"></p>
        </div>
        
        <button id="botaoValidarEmail">Validar Email</button>
        
        <div class="form-group">
            <label for="inputSenha">Senha</label>
            <input type="password" id="inputSenha">
            <p id="paragValidacaoSenha" class="validation-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
