<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Saudação com Webpack</title>
</head>
<body>
  <h1>Gerador de Saudação</h1>
  
  <label for="input-nome">Qual é o seu nome?</label>
  <input type="text" id="input-nome" placeholder="Digite seu nome aqui...">
  <button id="btn-saudar">Enviar</button>

  <div id="resultado" style="margin-top: 20px; color: blue;"></div>

  <!-- Aqui você chama o arquivo final compilado pelo Webpack (ex: dist/main.js) -->
  <script src="dist/main.js"></script> 
</body>
</html>
