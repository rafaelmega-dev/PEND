<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Câmera API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Câmera API</h1>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <br><br>

    <video id="camera" autoplay style="width: 200px"></video>
    <canvas id="canvas" style="display: none;"></canvas>
    
    <br>
    <button id="botao">Tirar foto</button>

    <h3>Cadastro:</h3>
    <div class="resultado">
        <span id="nomeExibido"></span>
        <img id="foto">
    </div>

    <script src="script.js"></script>
</body>
</html>
