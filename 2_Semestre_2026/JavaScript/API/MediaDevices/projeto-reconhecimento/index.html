  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .camera-container { position: relative; width: 640px; height: 480px; background: #eee; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    canvas { z-index: 10; }
    .status-ok { color: green; font-weight: bold; }
    .status-erro { color: red; font-weight: bold; }
    
    #webcam {
      transform: scaleX(-1); /* Espelha o vídeo horizontalmente */
    }
  </style>

<body>

  <h1>Reconhecimento Facial (Modo Local Seguro)</h1>
  <p id="status">Iniciando sistema local integrado...</p>

  <button id="btnLimpar" class="btn-perigo">Limpar Todos os Cadastros</button>

  <hr>

  <h2>1. Registrar Nova Pessoa</h2>
  <input type="text" id="nomeCadastro" placeholder="Nome da pessoa">
  <button id="btnCadastrar">Tirar Foto e Salvar</button>

  <hr>

  <h2>2. Verificação em Tempo Real</h2>
  <div class="camera-container">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="canvasOverlay"></canvas>
  </div>

  <script src="script.js"></script>
