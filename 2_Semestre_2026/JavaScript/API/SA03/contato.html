<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsToday - Contato</title>
    <!-- CSS exclusivo para esta página -->
    <link rel="stylesheet" href="contato.css">
    <link rel="icon" href="assets/logo_trial.png" type="image/png">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="topo-contato">
        <h1>NewsToday</h1>
        <p>Fale Conosco</p>
    </header>

    <!-- Menu de Navegação -->
    <nav class="menu-nav-contato">
        <ul class="menu-contato">
            <li><a href="index.html">Início</a></li>
            <li><a href="contato.html" class="ativo">Contato</a></li>
        </ul>
    </nav>

    <!-- Área do Formulário -->
    <main class="container-contato">
        <section class="caixa-formulario">
            <h2>Entre em Contato</h2>
            <p class="subtitulo">Tem alguma sugestão de pauta ou dúvida? Envie uma mensagem para a nossa redação.</p>
            
            <form action="#" class="form-contato">
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail Corporativo ou Pessoal</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Sua Mensagem</label>
                    <textarea id="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="rodape-contato">
        <p>NewsToday © 2026 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
