<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<h1>Jogo da Velha</h1>

<button id="btn-sortear">Sortear Quem Começa</button>

<h2 id="mensagem">Clique no botão para sortear quem começa!</h2>

<!-- Peças dos jogadores -->
<div class="pecas-container">

    <div id="bolinha_1" class="peca" draggable="true">⭕</div>
    <div id="bolinha_2" class="peca" draggable="true">⭕</div>
    <div id="bolinha_3" class="peca" draggable="true">⭕</div>
    <div id="bolinha_4" class="peca" draggable="true">⭕</div>
    <div id="bolinha_5" class="peca" draggable="true">⭕</div>

    <div id="xis_1" class="peca" draggable="true">✖️</div>
    <div id="xis_2" class="peca" draggable="true">✖️</div>
    <div id="xis_3" class="peca" draggable="true">✖️</div>
    <div id="xis_4" class="peca" draggable="true">✖️</div>
    <div id="xis_5" class="peca" draggable="true">✖️</div>

</div>

<!-- Tabuleiro 3x3 -->
<div class="tabuleiro">

    <div id="casa_1_1" class="casa"></div>
    <div id="casa_1_2" class="casa"></div>
    <div id="casa_1_3" class="casa"></div>

    <div id="casa_2_1" class="casa"></div>
    <div id="casa_2_2" class="casa"></div>
    <div id="casa_2_3" class="casa"></div>

    <div id="casa_3_1" class="casa"></div>
    <div id="casa_3_2" class="casa"></div>
    <div id="casa_3_3" class="casa"></div>

</div>

<script src="script.js"></script>


</body>

</html>
