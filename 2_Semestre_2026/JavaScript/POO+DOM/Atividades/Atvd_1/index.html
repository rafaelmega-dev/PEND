<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro - Pt. 1</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div id="container">
        <h1 id="titulo">Sistema de Cadastro - Pt. 1</h1>


        <input id="nome" type="text" placeholder="Produto">
        <input id="preco" type="number" placeholder="Preço do produto">
        <input id="categoria" type="text" placeholder="Categoria do produto">
        <input id="desconto" type="number" placeholder="Desconto do produto em %">

        <button id="botaoCadastrar">Cadastrar</button>
    </div>
    <div id="resultado"></div>
    
    <script src="script.js"></script>
    
</body>
</html>
